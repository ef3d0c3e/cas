# Tests run here, never on the development machine (CAS-158).
#
# The gmp-mpfr-sys build (GMP, MPFR, MPC for the `rug` oracle) dominates a cold
# run; Swatinem/rust-cache keeps it warm between runs.
#
# Ubuntu's runner images have no giac package, so the cas-giac oracle tests
# skip in `test` and run in `oracle`, a Debian container with libgiac, where
# CAS_GIAC_REQUIRED makes a library that does not load a failure.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The giac oracle (CAS-DOC-8 §12) against Debian's libgiac.
  oracle:
    runs-on: ubuntu-latest
    container: debian:sid
    env:
      CAS_GIAC_REQUIRED: "1"
    steps:
      # libgiac is pinned to 2.0.0.21+dfsg2-3+b1, the version the local caseval
      # probes use (T13, C0122): sid's 2.1.0.1 changed answers under us. The .deb
      # comes from snapshot.debian.org by SHA-1, so sid upgrades cannot move it;
      # its library dependencies come from sid. Any mismatch fails the job.
      - name: Install build dependencies and libgiac (pinned)
        env:
          GIAC_VERSION: 2.0.0.21+dfsg2-3+b1
          GIAC_URL: https://snapshot.debian.org/archive/debian/20261026T142754Z/pool/main/g/giac/libgiac0t64_2.0.0.21+dfsg2-3+b1_amd64.deb
          GIAC_SHA1: 110c5010e21f0a839174ef8629a7000f8a8462d5
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential m4
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/libgiac0t64.deb "$GIAC_URL"
          echo "$GIAC_SHA1  /tmp/libgiac0t64.deb" | sha1sum -c -
          apt-get install -y --no-install-recommends /tmp/libgiac0t64.deb
          test "$(dpkg-query -W -f='${Version}' libgiac0t64)" = "$GIAC_VERSION"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cas-giac --no-fail-fast

  # The fuzz crate sits outside the workspace and rots silently otherwise.
  # A type check on nightly (what cargo-fuzz uses) catches API drift on every
  # push; the real sanitizer builds happen in fuzz.yml.
  fuzz-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --all-targets

# Fuzzing runs here, never on the development machine (CAS-158).
#
# Two jobs mirror the build configurations in fuzz/README.md:
#   - asan:       `cargo fuzz run -O` with AddressSanitizer, for the targets
#                 that cross-check cas-num against GMP and exercise the
#                 readers, parsers and printers.
#   - assertions: `-O -a -s none` (debug assertions, no sanitizer) for the
#                 ball-function targets and eval — the crates have no `unsafe`
#                 code, ASan's quarantine more than doubles resident memory,
#                 and the debug assertions check the Float invariants and the
#                 natives' shortcuts against their full computation.
#
# Each job builds once and runs its targets in sequence, `time_per_target`
# seconds each (a dispatch input; the schedule uses the default). A crashed
# target is reported and the loop moves on, so one finding does not hide
# another. The corpus is carried between runs with the actions cache (the save
# key always misses, restore-keys picks up the newest), and crash artifacts
# are uploaded when a target fails.
#
# Caveat from fuzz/README.md: a stack overflow on eval's evaluation thread
# ends the process with SIGSEGV and no artifact; the last `Running:` line in
# the log names the input.
name: Fuzz

on:
  schedule:
    - cron: '14 2 * * 1,4' # 02:14 UTC Monday and Thursday
  workflow_dispatch:
    inputs:
      time_per_target:
        description: Seconds of fuzzing per target
        default: '300'
      targets:
        description: Space-separated targets to run (empty = all)
        default: ''

env:
  CARGO_TERM_COLOR: always
  FUZZ_TIME: ${{ inputs.time_per_target || '300' }}
  ONLY_TARGETS: ${{ inputs.targets || '' }}

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: asan
            flags: -O
            libfuzzer: -rss_limit_mb=2048 -malloc_limit_mb=1024
            targets: >-
              natural integer rational radix number_theory ball ball_text
              full_form lang_lex lang_parse lang_lower lang_session lang_print
          - group: assertions
            flags: -O -a -s none
            libfuzzer: -rss_limit_mb=2048 -malloc_limit_mb=1024 -timeout=60
            targets: ball_fns complex_fns machine_fns ball_consts eval
    runs-on: ubuntu-latest
    # Build plus 13 targets at the default budget; raise time_per_target past
    # ~20 minutes and the asan job will need this raised too (360 is the max).
    timeout-minutes: 350
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.group }}
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: corpus-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.group }}-
      - name: Build
        run: cargo fuzz build ${{ matrix.flags }}
      - name: Fuzz
        run: |
          status=0
          for t in ${{ matrix.targets }}; do
            if [ -n "$ONLY_TARGETS" ] && ! grep -qw "$t" <<<"$ONLY_TARGETS"; then
              continue
            fi
            # Seeding from fuzz/README.md: lowering and printing start from
            # what the parser found, the session from what lowering found.
            extra=""
            case "$t" in
              lang_lower|lang_print) extra="corpus/lang_parse" ;;
              lang_session) extra="corpus/lang_lower" ;;
            esac
            mkdir -p "corpus/$t"
            echo "::group::$t"
            cargo fuzz run ${{ matrix.flags }} "$t" "corpus/$t" $extra -- \
                -max_total_time="$FUZZ_TIME" ${{ matrix.libfuzzer }} \
                || { echo "::error title=fuzz $t::target $t failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: corpus-${{ matrix.group }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.group }}-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore

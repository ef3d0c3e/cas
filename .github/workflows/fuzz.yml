# Fuzzing runs here, never on the development machine (CAS-158, CAS-159).
#
# Every push fuzzes every target, one job per target in parallel, ten minutes
# each by default (`time_per_target` on a manual dispatch overrides it). A new
# push to the same ref cancels the previous run.
#
# Two build configurations, from fuzz/README.md:
#   - asan:       `cargo fuzz run -O` with AddressSanitizer, for the targets
#                 that cross-check cas-num against GMP and exercise the
#                 readers, parsers and printers.
#   - assertions: `-O -a -s none` (debug assertions, no sanitizer) for the
#                 ball-function targets, eval and the poly_ targets —
#                 the crates have no `unsafe` code, ASan's quarantine more
#                 than doubles resident memory, and the debug assertions
#                 check the Float invariants, the natives' shortcuts against
#                 their full computation, and cas-poly's invariants.
#
# The corpus is carried between runs with the actions cache, one cache per
# target (the save key always misses, restore-keys picks up the newest).
# Seeded targets (fuzz/README.md: lowering and printing start from what the
# parser found, the session from what lowering found) also restore the
# parent's newest corpus and pass it as a second corpus dir. Crash artifacts
# are uploaded when a target fails.
#
# Caveat from fuzz/README.md: a stack overflow on eval's evaluation thread
# ends the process with SIGSEGV and no artifact; the last `Running:` line in
# the log names the input.
name: Fuzz

on:
  push:
  workflow_dispatch:
    inputs:
      time_per_target:
        description: Seconds of fuzzing per target
        default: '600'
      targets:
        description: Space-separated targets to run (empty = all)
        default: ''

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUZZ_TIME: ${{ inputs.time_per_target || '600' }}

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - natural
          - integer
          - rational
          - radix
          - number_theory
          - ball
          - ball_text
          - full_form
          - lang_lex
          - lang_parse
          - lang_lower
          - lang_session
          - lang_print
          - ball_fns
          - complex_fns
          - machine_fns
          - ball_consts
          - eval
          - poly_factor
          - poly_sparse
          - poly_gcd
          - poly_groebner
          - poly_integrate
          - poly_roots
          - statistics
          - distributions
          - recurrences
          - fourier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      # On a dispatch that names targets, the other jobs skip every later step.
      - name: Check whether this target was asked for
        id: want
        run: |
          want='${{ inputs.targets }}'
          if [ -n "$want" ] && ! grep -qw '${{ matrix.target }}' <<<"$want"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pick the target's build configuration
        id: cfg
        if: steps.want.outputs.run == 'true'
        run: |
          case '${{ matrix.target }}' in
            ball_fns|complex_fns|machine_fns|ball_consts|eval|poly_factor|poly_sparse|poly_gcd|poly_groebner|poly_integrate|poly_roots|statistics|distributions|recurrences|fourier)
              echo "group=assertions" >> "$GITHUB_OUTPUT"
              echo "flags=-O -a -s none" >> "$GITHUB_OUTPUT"
              echo "libfuzzer=-rss_limit_mb=2048 -malloc_limit_mb=1024 -timeout=60" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "group=asan" >> "$GITHUB_OUTPUT"
              echo "flags=-O" >> "$GITHUB_OUTPUT"
              echo "libfuzzer=-rss_limit_mb=2048 -malloc_limit_mb=1024" >> "$GITHUB_OUTPUT"
              ;;
          esac
          case '${{ matrix.target }}' in
            lang_lower|lang_print) echo "seed=lang_parse" >> "$GITHUB_OUTPUT" ;;
            lang_session) echo "seed=lang_lower" >> "$GITHUB_OUTPUT" ;;
            *) echo "seed=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install build dependencies
        if: steps.want.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.want.outputs.run == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.want.outputs.run == 'true'
        with:
          tool: cargo-fuzz
      # One build cache per configuration, shared by its targets; rust-cache
      # skips the save when another job got there first.
      - uses: Swatinem/rust-cache@v2
        if: steps.want.outputs.run == 'true'
        with:
          workspaces: fuzz
          key: ${{ steps.cfg.outputs.group }}
      - name: Restore corpus
        if: steps.want.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-
      - name: Restore seed corpus
        if: steps.want.outputs.run == 'true' && steps.cfg.outputs.seed != ''
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ steps.cfg.outputs.seed }}
          key: corpus-${{ steps.cfg.outputs.seed }}-${{ github.run_id }}
          restore-keys: corpus-${{ steps.cfg.outputs.seed }}-
      # The prebuilt cargo-fuzz is a musl build and defaults `--target` to
      # its own triple, for which the toolchain has no std (CAS-160).
      #
      # ASan keeps every distinct allocation stack for good, and the deep
      # recursion of the language targets makes a new one per input: with
      # the default 30 frames, lang_print's corpus alone took 1 GB and its
      # runs hit the RSS limit, with 5 frames 150 MB (CAS-162). A smaller
      # quarantine and returning freed pages keep the rest down; the crates
      # have no `unsafe`, so the shorter use-after-free window costs little.
      - name: Fuzz
        if: steps.want.outputs.run == 'true'
        env:
          ASAN_OPTIONS: malloc_context_size=5:quarantine_size_mb=32:allocator_release_to_os_interval_ms=500
        run: |
          seed='${{ steps.cfg.outputs.seed }}'
          mkdir -p 'corpus/${{ matrix.target }}' ${seed:+"corpus/$seed"}
          cargo fuzz run --target x86_64-unknown-linux-gnu \
              ${{ steps.cfg.outputs.flags }} '${{ matrix.target }}' \
              'corpus/${{ matrix.target }}' ${seed:+"corpus/$seed"} -- \
              -max_total_time="$FUZZ_TIME" ${{ steps.cfg.outputs.libfuzzer }}
      - name: Save corpus
        if: always() && steps.want.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore

[package]
name = "cas-num"
description = "Arbitrary-precision integers, rationals and ball arithmetic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
mimalloc = "0.1.52"
proptest = "1.11.0"
rug = { version = "1.30.0", default-features = false, features = ["integer", "rational", "std"] }

[[bench]]
name = "num"
harness = false

[[bench]]
name = "num_mimalloc"
harness = false

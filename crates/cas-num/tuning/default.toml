# Written by cas-tune on 2026-10-18: a full run (1224 s, 421 builds, median
# timing noise 0.4%) after the radix-3 NTT lengths and size-aware NTT
# dispatch, then the NTT dispatch keys (179 s, noise 0.2%), redc_n_threshold
# after REDC by two limbs (88 s, noise 0.5%), the short-product keys with
# redc_n_threshold after short products in REDC (246 s, noise 0.8%), the
# Hensel division keys (292 s, then 178 s for the inverse and block keys;
# noise 0.2-1.3%), and on 2026-10-19 the unbalanced-product keys (204 s,
# then 88 s for mul_toom32_threshold, whose timings were 22% noisy on a busy
# machine over a flat optimum; the other two 0.3-0.5%).
# Algorithm thresholds for cas-num, embedded at build time (see build.rs).
# Sizes are in limbs unless noted. Measured on the development machine;
# `cargo run --release -p cas-tune` writes a file for yours.

# Multiplication: the shorter operand's length from which each algorithm is
# used (kernel/mul.rs). Toom-32 and Toom-42 take unbalanced products, with
# the longer operand 4/3 to 7/4 and 7/4 to 11/4 times the shorter.
mul_karatsuba_threshold = 21
mul_toom3_threshold = 136
mul_toom4_threshold = 459
mul_toom32_threshold = 45
mul_toom42_threshold = 70
mul_ntt_threshold = 3799

# Squaring (kernel/mul.rs).
sqr_karatsuba_threshold = 35
sqr_toom3_threshold = 140
sqr_toom4_threshold = 651
sqr_ntt_threshold = 2254
# The NTT takes a product from the threshold when its transform is as tight
# as the size allows; at a size whose transform costs 1/e of the ideal, from
# threshold times e^-(x / 10), x = ntt_efficiency_exponent (kernel/mul.rs).
ntt_efficiency_exponent = 27
# An unbalanced product (the longer operand at least 4/3 the shorter) takes
# one NTT when the transform's modelled cost is below Toom's, scaled from the
# balanced crossover as (an / bn) (bn / T)^(x / 10), x = ntt_unbalanced_exponent.
ntt_unbalanced_exponent = 16

# NTT (kernel/ntt.rs): transforms of at most this many coefficients run
# layer by layer; longer ones split in halves first.
ntt_block = 256
# A product wraps around a halved transform when the recomputed top product
# is at most 1/ntt_wrap_fraction of the transform.
ntt_wrap_fraction = 1
# Products modulo B^m - 1 (Newton division) take a cyclic transform of m
# coefficients from this power-of-two m; below it, the full product reduced.
mul_wrap_ntt_threshold = 2048
# Short products a b mod B^n (Montgomery's quotient): length from which they
# split by divide and conquer, and from which they take the full product.
mullo_dc_threshold = 50
mullo_mul_threshold = 6402

# Division (kernel/div.rs): divisor length from which divide and conquer is
# used.
dc_div_threshold = 14
# Divisor and quotient length from which division uses Barrett's estimates
# from Newton's reciprocal (kernel/div/mu.rs), and length from which that
# reciprocal takes Newton steps instead of an exact division.
mu_div_threshold = 6419
inv_newton_threshold = 8
# Hensel division (kernel/div/bdiv.rs): divisor length from which the 2-adic
# quotient works in blocks with the 2-adic inverse, and length from which
# that inverse takes Newton steps; divisor length from which exact division
# with its check divides with remainder instead.
bdiv_mu_threshold = 154
binv_newton_threshold = 43
divexact_div_threshold = 46

# Montgomery reduction (modular/ring.rs): modulus length from which REDC
# multiplies by -n^-1 mod R instead of eliminating one limb at a time.
redc_n_threshold = 108

# GCD (natural/gcd.rs): smaller operand length from which half-GCD steps
# replace Lehmer steps, and length from which the half-GCD recurses; entry
# length from which its 2x2 matrix products take seven products, not eight.
gcd_dc_threshold = 802
hgcd_threshold = 168
matrix22_strassen_threshold = 488

# Radix conversion (natural/radix.rs): limbs from which to_string, and
# digits from which parsing, split by divide and conquer.
to_string_dc_threshold = 26
from_string_dc_threshold = 3997

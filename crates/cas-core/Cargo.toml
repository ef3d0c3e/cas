[package]
name = "cas-core"
description = "Hash-consed symbolic expressions, symbols and attributes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
cas-num.workspace = true
cas-poly.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
unicode-ident.workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest.workspace = true
# MPFR, the oracle of `N` (CAS-84), with cas-num's features so that one build
# serves both.
rug = { version = "1.30.0", default-features = false, features = ["complex", "float", "integer", "rational", "std"] }

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "rules"
harness = false

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "calculus"
harness = false

[[bench]]
name = "poly"
harness = false

[lints]
workspace = true
